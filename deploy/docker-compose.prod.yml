# 信逢 Inkling · 生产编排（单机 2C4G 起步）
# 务必在「仓库根目录」执行，让 --env-file 与 env_file 指向同一份 .env：
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
# 首次种子（一次性）：见 docs/设计文档.md「首次部署」。
name: inkling

# 容器日志轮转（json-file 默认无上限，长跑会把磁盘写满）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: inkling-web:latest
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?在 .env 设置正式域名或 :80}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *default-logging
    mem_limit: 192m
    cpus: 0.5

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: inkling-api:latest
    restart: unless-stopped
    env_file:
      - ../.env # 只放密钥与业务参数（JWT_SECRET/DELIVERY_HOURS_SCALE 等）；连接串由下方 environment 生成，无需手改 host
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgresql://${POSTGRES_USER:-inkling}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inkling}?schema=public'
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # 不对外暴露端口；仅 Caddy 经内部网络访问 api:3001
    logging: *default-logging
    mem_limit: 768m
    cpus: 1.0

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-inkling}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 设置强随机密码（仅用字母数字，避免 URL 保留字符）}
      POSTGRES_DB: ${POSTGRES_DB:-inkling}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-inkling}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    mem_limit: 512m
    cpus: 1.0

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    logging: *default-logging
    mem_limit: 192m
    cpus: 0.5

# 资源限额为 2C4G 机型保守值：随机型与观测（docker stats）调整；修改后 up -d 生效。
volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
